_schema-version: 3.3.0
ID: cap
version: 1.0.0
description: "A simple CAP project."
parameters:
  enable-parallel-deployments: true
build-parameters:
  before-all:
    - builder: custom
      commands:
        - npm ci
        - npx cds build --production
modules:
  - name: cap-srv
    type: nodejs
    path: gen/srv
    parameters:
      buildpack: nodejs_buildpack
      readiness-health-check-type: http
      readiness-health-check-http-endpoint: /health
    build-parameters:
      builder: npm
    provides:
      - name: srv-api # required by consumers of CAP services (e.g. approuter)
        properties:
          srv-url: ${default-url}
    requires:
      - name: cap-db
      - name: cap-xsuaa

  - name: cap-db-deployer
    type: hdb
    path: gen/db
    parameters:
      buildpack: nodejs_buildpack
    requires:
      - name: cap-db

resources:
  - name: cap-db
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: insurance_mcp_hdi

  - name: cap-xsuaa
    type: org.cloudfoundry.existing-service
    parameters:
      service-name: insurance_mcp_xsuaa
